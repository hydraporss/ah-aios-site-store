<style>

</style></head><body>

<script>
const IC={book:'<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6v14"/>',plug:'<path d="M10 3H7a2 2 0 0 0-2 2v3h2a2 2 0 1 1 0 4H5v4a2 2 0 0 0 2 2h4v-2a2 2 0 1 1 4 0v2h2a2 2 0 0 0 2-2v-3h-2a2 2 0 1 1 0-4h2V5a2 2 0 0 0-2-2h-3a2 2 0 1 0-4 0z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',doc:'<path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h5"/>',code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',cloud:'<path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9.5 4 4 0 0 1 17.5 18z"/>',pal:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2.2S13 17 15 17h2a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="10" r="1"/>',chart:'<path d="M4 20V4M4 20h16M8 17v-5M13 17V8M18 17v-8"/>',brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V4a3 3 0 0 0-3 0zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',gift:'<rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M5 12v9h14v-9M12 8c-3 0-5-1-5-3s3-2 5 3c2-5 5-5 5-3s-2 3-5 3"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]||""}</svg>`,$=s=>document.querySelector(s);
const money=p=>p?`$${p}`:"Free",T=t=>TYPES[t],S=SKILLS,get=id=>S.find(s=>s.id===id);
const tg=a=>`<div class="tg">${a.map(x=>`<span>${x}</span>`).join("")}</div>`;
const card=s=>{const t=T(s.type);return`<div class="card" style="--k:${t.color}"><span class="pr ${s.price?"":"free"}">${money(s.price)}</span><div class="ph"><div class="chip">${ic(t.icon)}</div><h3 style="padding-right:46px">${s.name}</h3></div><p>${s.tagline}</p>${tg(s.tags||[t.label])}<button class="btn f" onclick="buy('${s.id}')">${s.price?"Buy Now":"Get Free"}</button></div>`};
function buy(id){const s=get(id),u=s.price?s.stripe:s.download;
 if(u&&!/REPLACE_ME/.test(u)){location.href=u;return}
 const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><h3>Almost ready</h3><p>This ${s.price?"checkout":"download"} link isn't set yet. Add it for <b>${s.name}</b> in <code>catalog.js</code>.</p><button class="btn s">OK</button></div>`;m.onclick=()=>m.remove();document.body.appendChild(m)}
function orbit(){const N=[["Learn","Knowledge Skills","book","#38bdf8"],["Build","Coding Skills","code","#8a5cff"],["Deploy","Infrastructure","cloud","#3b8cff"],["Design","Creative Tools","pal","#ff8a4c"],["Analyze","Data & Finance","chart","#34d399"],["Remember","Personal Memory","brain","#d46bff"],["Research","Web Intelligence","globe","#22d3ee"]];
let s=`<svg class="orbit" viewBox="0 0 560 450"><ellipse cx="280" cy="225" rx="205" ry="168" fill="none" stroke="#2a4bb5" stroke-dasharray="3 7"/><circle cx="280" cy="225" r="128" fill="#2b7bff" opacity=".13"/><circle cx="280" cy="225" r="98" fill="url(#gl)" stroke="#5ab0ff" stroke-width="2"/><path d="M252 222l28-52 28 52M263 204h34" stroke="url(#lg)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="256" text-anchor="middle" fill="#fff" font-weight="800" font-size="21" letter-spacing="1">AH AIOS</text><text x="280" y="274" text-anchor="middle" fill="#9fb4ee" font-size="9" letter-spacing="3">SKILLS STORE</text>`;
N.forEach((n,i)=>{const a=(-90+i*360/7)*Math.PI/180,x=280+205*Math.cos(a),y=225+168*Math.sin(a),r=Math.cos(a)>.1,l=Math.cos(a)<-.1,m=!r&&!l,ax=m?"middle":r?"start":"end",tx=x+(m?0:r?36:-36),ty=m?y-38:y-2;
s+=`<circle cx="${x}" cy="${y}" r="27" fill="#08102c" stroke="${n[3]}" stroke-width="2"/><svg x="${x-12}" y="${y-12}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${n[3]}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n[2]]}</svg><text x="${tx}" y="${ty}" text-anchor="${ax}" fill="#fff" font-weight="700" font-size="15">${n[0]}</text><text x="${tx}" y="${ty+16}" text-anchor="${ax}" fill="#8f9cc9" font-size="11">${n[1]}</text>`});return s+"</svg>"}
const steps=`<div class="steps">${[["Discover","Browse the marketplace and find the skills you need."],["Purchase","Secure checkout with Stripe Payment Links."],["Use","Get access immediately and start using the skill."]].map((x,i)=>(i?'<span class="ar">→</span>':'')+`<div class="step"><div class="n">${i+1}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div>`;
const cta=`<div class="card" style="text-align:center;padding:44px 20px;margin-top:56px;background:linear-gradient(135deg,#1a3a9a66,#5b2fb866)"><h2>Give your AI a new skill today</h2><p class="mut" style="margin:0 0 20px">Pick a skill, check out securely with Stripe, and install in minutes.</p><div class="row" style="justify-content:center"><a class="btn" href="#catalog">Explore Marketplace</a></div></div>`;
const faq=[["What exactly do I get?","A downloadable package: instructions, templates and (for MCP packages) server code, plus a short install guide."],["How is it delivered?","Right after checkout, to the email you used. Free skills download instantly."],["Which AI tools do they work with?","Each listing shows compatibility. Skills target Claude products; prompt and workflow packs work with any assistant."],["Is payment secure?","Yes. Checkout is handled by Stripe. We never see or store your card details."],["Can I get a refund?","Yes, within "+SITE.refundDays+" days if the skill doesn't work as described. Just email us."],["Do I get updates?","Updates are included for the period stated on each listing."]];

const P={

<div class="types">${Object.entries(TYPES).map(([k,t])=>`<div style="--k:${t.color}"><div class="chip">${ic(t.icon)}</div><div><h3>${t.label}s</h3><p>${TD[k]}</p><a href="#catalog-${k}">Learn more →</a></div></div>`).join("")}</div>
<section class="sec"><div class="sh"><span class="star">★</span><h2>Featured Skills</h2><span class="mut" style="padding-bottom:6px">Hand-picked skills to help you get more done.</span><a class="btn s o" href="#catalog">View all skills →</a></div><div class="grid">${S.filter(s=>s.featured).map(card).join("")}</div></section>
<section class="sec"><h2>How It Works</h2>${steps}</section>${cta}`,
"how-it-works":()=>`<div class="crumb"><a href="#home">Home</a> / How It Works</div><h1 style="font-size:clamp(32px,5vw,50px)">How it works</h1><p class="lead">From discovery to using your new skill in three steps.</p>${steps}<h2 style="margin-top:50px">Questions</h2>${faq.slice(0,3).map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}${cta}`,
faq:()=>`<div class="crumb"><a href="#home">Home</a> / FAQ</div><h1 style="font-size:clamp(32px,5vw,50px)">Frequently asked questions</h1>${faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}<p class="mut">Still stuck? <a href="mailto:${SITE.email}" style="color:var(--c)">${SITE.email}</a></p>`,
thanks:()=>`<div class="det" style="margin-top:50px"><div style="text-align:center;padding-top:10px"><div class="ok">✓</div><h1 style="font-size:46px">Thank You!</h1><p class="lead" style="margin:0 auto 22px">Your purchase was successful.<br>${SITE.deliveryNote}</p><div class="row" style="justify-content:center"><a class="btn o" href="#catalog">Browse More Skills</a><a class="btn" href="#home">Back to Home</a></div></div><div class="card"><h3>What's Next?</h3><ul class="ck" style="margin-top:8px"><li>Check your email</li><li>Follow the setup guide</li><li>Start using your new skill</li><li>Need help? <a href="mailto:${SITE.email}" style="color:var(--c)">Contact us</a></li></ul></div></div>`};
function skill(id){const s=get(id);if(!s)return catalogHtml();const t=T(s.type);
 return`<div class="crumb"><a href="#home">Home</a> / <a href="#catalog">Marketplace</a> / ${s.name}</div><div class="det" style="--k:${t.color}"><div><div class="ph" style="gap:18px"><div class="chip" style="width:68px;height:68px">${ic(t.icon)}</div><div><h1 style="font-size:clamp(28px,4vw,42px);margin:0">${s.name}</h1><span class="mut">${t.label}</span></div></div><p class="lead" style="margin-top:14px">${s.tagline}</p><p class="mut">${s.about}</p>${tg(s.tags||[])}<h2 style="font-size:21px;margin-top:26px">What's included</h2><ul class="ck">${s.includes.map(x=>`<li>${x}</li>`).join("")}</ul><h2 style="font-size:21px;margin-top:26px">Works with</h2>${tg(s.works)}</div>
<div class="card box"><div class="sh" style="align-items:center"><b style="font-size:38px">${money(s.price)}</b></div><button class="btn f" onclick="buy('${s.id}')" style="padding:15px">${s.price?"Buy Now":"Get Free"}</button><ul class="ck"><li>Instant access after payment</li><li>Updates included</li><li>Works with ${s.works[0]}</li><li>${SITE.refundDays}-day refund guarantee</li></ul></div></div><h2 style="margin-top:50px">More skills</h2><div class="grid">${S.filter(x=>x.id!==id).slice(0,4).map(card).join("")}</div>`}
const catalogHtml=()=>`<div class="crumb"><a href="#home">Home</a> / Marketplace</div><h1 style="font-size:clamp(32px,5vw,50px);margin:0 0 6px">Skills Marketplace</h1><p class="mut" style="margin:0 0 4px">Search skills, tools, or keywords.</p><div class="bar2"><input class="s" id="q" placeholder="Search skills, tools, or keywords…"></div><div class="bar2"><div class="pills" id="tabs"></div><label class="mut">Sort: <select id="so"><option value="p">Popular</option><option value="l">Price: low to high</option><option value="h">Price: high to low</option><option value="n">Name</option></select></label></div><div class="grid" id="list"></div>`;
function render(){let k=location.hash.slice(1)||"home";const a=$("#app");
 if(k.startsWith("skill-"))a.innerHTML=skill(k.slice(6));else if(k.startsWith("catalog"))a.innerHTML=catalogHtml();else a.innerHTML=(P[k]||P.home)();
 const sk=k.startsWith("skill-")?get(k.slice(6)):null;document.title=(sk?sk.name+" · ":"")+SITE.name;scrollTo(0,0);
 const nk=k.startsWith("skill-")||k.startsWith("catalog")?"catalog":(P[k]?k:"home");document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.k===nk));
 if(a.querySelector&&$("#list")){let f=TYPES[k.slice(8)]?k.slice(8):"all";const tb=$("#tabs"),q=$("#q"),so=$("#so");
  const draw=()=>{tb.innerHTML=[["all","All"],...Object.entries(TYPES).map(([x,v])=>[x,v.label+"s"])].map(([x,l])=>`<button data-f="${x}" class="${x===f?"on":""}">${l}</button>`).join("");
   tb.querySelectorAll("button").forEach(b=>b.onclick=()=>{f=b.dataset.f;draw()});
   const v=q.value.toLowerCase(),o=so.value;let r=S.filter(x=>(f==="all"||x.type===f)&&(x.name+x.tagline+(x.tags||[]).join()).toLowerCase().includes(v));
   if(o==="l")r.sort((x,y)=>x.price-y.price);if(o==="h")r.sort((x,y)=>y.price-x.price);if(o==="n")r.sort((x,y)=>x.name.localeCompare(y.name));
   $("#list").innerHTML=r.map(card).join("")||'<p class="mut">No skills match.</p>'};q.oninput=draw;so.onchange=draw;draw()}}
$("#bn").textContent=SITE.name;$("#fm").href="mailto:"+SITE.email;

</script></body></html>
